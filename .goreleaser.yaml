version: 2

project_name: emhcl

builds:
  - id: emhcl
    main: ./cmd/emhcl
    binary: emhcl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.buildVersion={{ .Tag }}

archives:
  - id: default
    ids:
      - emhcl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: event-modeling-hcl
    name: eventmodeling-hcl
